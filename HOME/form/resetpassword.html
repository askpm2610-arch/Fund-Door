<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fund Door - Reset Password</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #064734 0%, #E0FFC2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.card { background: rgba(255,255,255,0.92); border-radius: 24px; padding: 36px; width: 100%; max-width: 420px; box-shadow: 0 25px 70px rgba(0,0,0,0.16); }
.card h1 { font-size: 28px; margin-bottom: 12px; color: #064734; }
.card p { color: #455; margin-bottom: 24px; line-height: 1.6; }
.form-group { margin-bottom: 18px; }
.form-group input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid #ccc; font-size: 15px; }
.form-group input:focus { outline: none; border-color: #064734; }
.button { width: 100%; padding: 14px; border: none; border-radius: 14px; background: linear-gradient(45deg, #064734, #0d6d4a); color: white; font-weight: 700; cursor: pointer; }
.button:hover { opacity: 0.95; }
.links { margin-top: 18px; text-align: center; }
.links a { color: #064734; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <h1>Reset Your Password</h1>
  <p>Enter the email, OTP code sent to your inbox, and your new password.</p>
  <form id="resetForm">
    <div class="form-group">
      <input type="email" id="email" placeholder="Email address" required>
    </div>
    <div class="form-group">
      <input type="text" id="otp" placeholder="OTP code" maxlength="6" required>
    </div>
    <div class="form-group">
      <input type="password" id="password" placeholder="New password" required>
    </div>
    <div class="form-group">
      <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
    </div>
    <button class="button" type="submit">Reset Password</button>
  </form>
  <div class="links">
    <p><a href="login.html">Back to login</a></p>
  </div>
</div>
<script>
document.getElementById('resetForm').addEventListener('submit', async function(event) {
  event.preventDefault();
  const email = document.getElementById('email').value.trim();
  const otp = document.getElementById('otp').value.trim();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (!email || !otp || !password || !confirmPassword) {
    alert('All fields are required.');
    return;
  }
  if (password !== confirmPassword) {
    alert('Passwords do not match.');
    return;
  }

  const response = await fetch('/api/reset-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, otp, password })
  });

  const data = await response.json();
  if (!response.ok) {
    alert(data.message || 'Unable to reset password.');
    return;
  }

  alert(data.message);
  window.location.href = 'login.html';
});
</script>
</body>
</html>
